<rect x="120" y="30" width="300" height="60" rx="30.0" fill="#D5F5E3" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="normal" fill="#1B2631"><tspan x="270" y="60.0">Store owner snaps product photo</tspan></text>
<rect x="120" y="150" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#1B2631"><tspan x="270" y="184.0">1. Capture &amp; Pre-process</tspan><tspan x="270" y="200.0">deskew, crop, glare / exposure</tspan></text>
<rect x="120" y="294" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#1B2631"><tspan x="270" y="320.0">2. Recognise</tspan><tspan x="270" y="336.0">VLM + OCR fusion -&gt; brand,</tspan><tspan x="270" y="352.0">variant, size, category</tspan></text>
<rect x="120" y="438" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#1B2631"><tspan x="270" y="464.0">3. Retrieve</tspan><tspan x="270" y="480.0">comparable prices, canonical</tspan><tspan x="270" y="496.0">name, candidate images</tspan></text>
<rect x="120" y="582" width="300" height="94" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#1B2631"><tspan x="270" y="613.0">4. Generate</tspan><tspan x="270" y="629.0">grounded copy, price + range,</tspan><tspan x="270" y="645.0">select &amp; verify best image</tspan></text>
<polygon points="270,687.0 430.0,762 270,837.0 110.0,762" fill="#FCF3CF" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="normal" fill="#1B2631"><tspan x="270" y="747.0">5. Guardrails pass?</tspan><tspan x="270" y="762.0">age-restriction, hallucination,</tspan><tspan x="270" y="777.0">image-match, confidence</tspan></text>
<polygon points="120,900 420,900 398,982 142,982" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="normal" fill="#1B2631"><tspan x="270" y="933.0">6. Human Review</tspan><tspan x="270" y="949.0">owner edits / approves</tspan></text>
