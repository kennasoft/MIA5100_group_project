<rect x="120" y="30" width="300" height="60" rx="30.0" fill="#D5F5E3" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="60.0">Store owner snaps product photo</tspan></text>
<rect x="120" y="150" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="184.0">1. Capture — OpenCV</tspan><tspan x="270" y="200.0">orient, downscale 1024px, CLAHE</tspan></text>
<rect x="120" y="294" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="328.0">2. Recognise — hosted VLM + OCR</tspan><tspan x="270" y="344.0">fallback: image .json sidecar</tspan></text>
<rect x="120" y="438" width="300" height="84" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="472.0">3. Retrieve — Open Food Facts</tspan><tspan x="270" y="488.0">+ Open Prices (fallback: offline)</tspan></text>
<rect x="120" y="582" width="300" height="94" rx="6" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="621.0">4. Generate — hosted LLM (grounded)</tspan><tspan x="270" y="637.0">fallback: deterministic template</tspan></text>
<polygon points="270,695.0 430.0,770 270,845.0 110.0,770" fill="#FCF3CF" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B2631"><tspan x="270" y="755.0">5. Guardrails pass?</tspan><tspan x="270" y="770.0">rules: age (tobacco/alcohol),</tspan><tspan x="270" y="785.0">confidence, claim-grounding</tspan></text>
<polygon points="120,905 420,905 398,987 142,987" fill="#D6EAF8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="938.0">6. Human Review — Gradio UI</tspan><tspan x="270" y="954.0">owner edits / approves</tspan></text>
<polygon points="270,1045.0 430.0,1110 270,1175.0 110.0,1110" fill="#FCF3CF" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1B2631"><tspan x="270" y="1101.0">Owner</tspan><tspan x="270" y="1119.0">approves?</tspan></text>
<rect x="120" y="1255" width="300" height="66" rx="33.0" fill="#D5F5E3" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="270" y="1280.0">Publish — CSV catalogue</tspan><tspan x="270" y="1296.0">(store.py)</tspan></text>
