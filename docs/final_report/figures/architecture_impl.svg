<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="273.0">Claude / Gemini / OpenAI</tspan><tspan x="690.0" y="289.0">vision (providers.py)</tspan></text>
<rect x="560" y="330" width="260" height="62" rx="6" fill="#E8DAEF" stroke="#1B2631" stroke-width="2"/><line x1="570" y1="330" x2="570" y2="392" stroke="#1B2631" stroke-width="2"/><line x1="810" y1="330" x2="810" y2="392" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="353.0">OCR — via VLM</tspan><tspan x="690.0" y="369.0">(PaddleOCR optional)</tspan></text>
<rect x="560" y="430" width="260" height="62" rx="6" fill="#E8DAEF" stroke="#1B2631" stroke-width="2"/><line x1="570" y1="430" x2="570" y2="492" stroke="#1B2631" stroke-width="2"/><line x1="810" y1="430" x2="810" y2="492" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="453.0">Open Food Facts /</tspan><tspan x="690.0" y="469.0">Open Products Facts API</tspan></text>
<rect x="560" y="515" width="260" height="62" rx="6" fill="#E8DAEF" stroke="#1B2631" stroke-width="2"/><line x1="570" y1="515" x2="570" y2="577" stroke="#1B2631" stroke-width="2"/><line x1="810" y1="515" x2="810" y2="577" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="546.0">Open Prices API</tspan></text>
<rect x="560" y="600" width="260" height="62" rx="6" fill="#E8DAEF" stroke="#1B2631" stroke-width="2"/><line x1="570" y1="600" x2="570" y2="662" stroke="#1B2631" stroke-width="2"/><line x1="810" y1="600" x2="810" y2="662" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="623.0">Claude / Gemini / OpenAI</tspan><tspan x="690.0" y="639.0">text (providers.py)</tspan></text>
<rect x="560" y="685" width="260" height="62" rx="6" fill="#E8DAEF" stroke="#1B2631" stroke-width="2"/><line x1="570" y1="685" x2="570" y2="747" stroke="#1B2631" stroke-width="2"/><line x1="810" y1="685" x2="810" y2="747" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="708.0">OpenCLIP ViT-B/32</tspan><tspan x="690.0" y="724.0">/ imagehash pHash</tspan></text>
<rect x="560" y="760" width="260" height="84" rx="6" fill="#FADBD8" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B2631"><tspan x="690.0" y="787.0">Flag &amp; hold</tspan><tspan x="690.0" y="802.0">restricted / low-confidence /</tspan><tspan x="690.0" y="817.0">unverified claim / no image match</tspan></text>
<path d="M560,994 A130.0,14 0 0 1 820,994 L820,1074 A130.0,14 0 0 1 560,1074 Z" fill="#EAECEE" stroke="#1B2631" stroke-width="2"/><path d="M560,994 A130.0,14 0 0 0 820,994" fill="none" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1B2631"><tspan x="690.0" y="1032.0">Feedback + catalogue store</tspan><tspan x="690.0" y="1048.0">(CSV / SQLite)</tspan></text>
<rect x="60" y="1360" width="760" height="60" rx="8" fill="#FEF9E7" stroke="#1B2631" stroke-width="2"/>
<text text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1B2631"><tspan x="440" y="1382.5">Hosted calls gated by GEMINI_API_KEY / OPENAI_API_KEY (config.py). Every stage has an</tspan><tspan x="440" y="1397.5">offline fallback, so the pipeline runs end-to-end with no key.</tspan></text>
